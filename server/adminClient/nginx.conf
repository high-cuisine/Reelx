server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Статика Vite: dist/assets/* (в HTML пути /admin/assets/*, внешний nginx срезает /admin/)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /vite.svg {
        try_files $uri =404;
    }

    # SPA (роуты React Router после загрузки index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
